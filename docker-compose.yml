services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket_intelligence_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_intelligence
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
    ports:
      - "5432:5432"
    volumes:
      - ticket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ticket_pgdata:
